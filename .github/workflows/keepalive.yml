name: Supabase wach halten

# Kostenlose Supabase-Projekte pausieren, wenn eine Woche lang zu wenig Datenbank-Aktivität da ist –
# dann fallen KI-Suche und Konto-Sync aus. Laut Supabase reichen ein paar Anfragen pro Tag,
# daher dreimal täglich mehrere Abfragen.
on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Datenbank anfragen
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" js/config.js | head -1)
          KEY=$(grep -o "eyJ[^'\"]*" js/config.js | head -1)
          H=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json")
          for i in 1 2 3; do
            curl -fsS --retry 3 --retry-delay 20 "$URL/rest/v1/user_state?select=user_id&limit=1" "${H[@]}"
            echo
            sleep 5
          done
